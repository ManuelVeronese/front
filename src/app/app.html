<div class="app-container">
  <header *ngIf="showHeader" class="bg-primary text-white py-3 mb-4">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h1 class="h3 mb-0">
            <i class="bi bi-truck me-2"></i>
            PedidosYa - Delivery Management
          </h1>
        </div>
        <div class="col-md-6">
          <nav class="navbar-nav">
            <div class="d-flex gap-3 align-items-center">
              <a href="/zones" class="btn btn-outline-light">
                <i class="bi bi-geo-alt me-1"></i>
                Zonas
              </a>
              <a href="/deliveries" class="btn btn-outline-light">
                <i class="bi bi-truck me-1"></i>
                Deliveries
              </a>
              <div class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                  <i class="bi bi-person me-1"></i>
                  {{ currentUser?.nombre || 'Usuario' }}
                </button>
                <ul class="dropdown-menu">
                  <li><button class="dropdown-item" (click)="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>
                    Cerrar Sesión
                  </button></li>
                </ul>
              </div>
            </div>
          </nav>
        </div>
      </div>
    </div>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>
</div>
